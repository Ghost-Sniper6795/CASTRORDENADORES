<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel · CastrOrdenadores</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-box h1 {
      font-size: 22px;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .login-box p {
      color: #666;
      font-size: 13px;
      margin-bottom: 25px;
    }
    .login-box input {
      width: 100%;
      background: #181818;
      border: 1px solid #333;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      outline: none;
    }
    .login-box input:focus { border-color: #9b6cff; }
    .login-box button {
      width: 100%;
      background: #9b6cff;
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
    }
    .login-box button:hover {
      box-shadow: 0 10px 30px rgba(155,108,255,.35);
    }
    .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; }

    /* PANEL */
    .panel { display: none; }
    .panel.active { display: block; }

    header {
      background: rgba(5,5,5,.9);
      border-bottom: 1px solid #222;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    header h1 {
      font-size: 16px;
      letter-spacing: 2px;
    }
    header h1 span { color: #9b6cff; }
    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      padding: 9px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      transition: .3s;
    }
    .btn:hover { border-color: #9b6cff; }
    .btn-primary {
      background: #9b6cff;
      border-color: #9b6cff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      padding: 30px 5%;
    }
    .stat-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 22px;
    }
    .stat-card strong {
      display: block;
      font-size: 32px;
      color: #9b6cff;
    }
    .stat-card span {
      font-size: 11px;
      color: #666;
      letter-spacing: 1px;
    }

    .content {
      padding: 10px 5% 60px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #222;
      border-radius: 12px;
      background: #0d0d0d;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 14px 16px;
      background: #151515;
      color: #888;
      font-size: 11px;
      letter-spacing: 1px;
      border-bottom: 1px solid #222;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      vertical-align: top;
    }
    tr:hover td { background: #121212; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-pendiente { background: #3a2a00; color: #ffc107; }
    .badge-pagado { background: #0a2e1a; color: #64ff9a; }
    .badge-enviado { background: #0a1e3a; color: #6bb3ff; }
    .badge-cancelado { background: #2e0a0a; color: #ff6b6b; }
    .badge-completado { background: #1a0a2e; color: #c9a0ff; }

    select.estado-select {
      background: #181818;
      border: 1px solid #333;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-del {
      background: transparent;
      border: 1px solid #442222;
      color: #ff6b6b;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-del:hover { background: #2e0a0a; }
    .empty {
      text-align: center;
      padding: 60px;
      color: #555;
    }
    .addr {
      font-size: 12px;
      color: #888;
      max-width: 220px;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <h1>CASTRORDENADORES<span style="color:#9b6cff">.</span></h1>
      <p>Panel de administración · /cirrosis</p>
      <input type="password" id="password" placeholder="Contraseña" autofocus>
      <button onclick="login()">Entrar</button>
      <p class="error" id="loginError"></p>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel" id="panel">
    <header>
      <h1>CASTRORDENADORES<span>.</span> · Admin</h1>
      <div class="header-actions">
        <button class="btn" onclick="cargarPedidos()">Actualizar</button>
        <button class="btn" onclick="logout()">Salir</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Estado</th>
              <th>Cliente</th>
              <th>Contacto</th>
              <th>Dirección</th>
              <th>Producto</th>
              <th>Total</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">No hay pedidos todavía.</div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem("adminToken") || "";

    function login() {
      const pass = document.getElementById("password").value;
      if (!pass) return;
      token = pass;
      localStorage.setItem("adminToken", token);
      document.getElementById("loginError").textContent = "";
      showPanel();
      cargarPedidos();
    }

    function logout() {
      token = "";
      localStorage.removeItem("adminToken");
      document.getElementById("panel").classList.remove("active");
      document.getElementById("loginScreen").style.display = "flex";
    }

    function showPanel() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("panel").classList.add("active");
    }

    async function cargarPedidos() {
      try {
        const res = await fetch("/api/admin/pedidos", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.status === 401) {
          document.getElementById("loginError").textContent = "Contraseña incorrecta";
          logout();
          return;
        }
        const pedidos = await res.json();
        render(pedidos);
      } catch (e) {
        console.error(e);
      }
    }

    function render(pedidos) {
      const tbody = document.getElementById("tbody");
      const empty = document.getElementById("empty");

      // Stats
      const total = pedidos.length;
      const pagados = pedidos.filter(p => p.estado === "pagado" || p.estado === "enviado" || p.estado === "completado").length;
      const pendientes = pedidos.filter(p => p.estado === "pendiente").length;
      const ingresos = pedidos
        .filter(p => ["pagado","enviado","completado"].includes(p.estado))
        .reduce((s, p) => s + (p.precio_centavos || 0), 0);

      document.getElementById("stats").innerHTML = `
        <div class="stat-card"><strong>${total}</strong><span>TOTAL PEDIDOS</span></div>
        <div class="stat-card"><strong>${pagados}</strong><span>PAGADOS</span></div>
        <div class="stat-card"><strong>${pendientes}</strong><span>PENDIENTES</span></div>
        <div class="stat-card"><strong>${(ingresos/100).toFixed(2)} €</strong><span>INGRESOS</span></div>
      `;

      if (!pedidos.length) {
        tbody.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      tbody.innerHTML = pedidos.map(p => `
        <tr>
          <td>${p.id}</td>
          <td><span class="badge badge-${p.estado}">${p.estado.toUpperCase()}</span></td>
          <td>${esc(p.nombre)}</td>
          <td>
            ${esc(p.telefono)}<br>
            <span style="color:#666;font-size:11px">${esc(p.email || "—")}</span>
          </td>
          <td class="addr">
            ${esc(p.direccion)}<br>
            ${esc(p.codigo_postal)} ${esc(p.ciudad)} (${esc(p.provincia)})
          </td>
          <td>${esc(p.producto)}</td>
          <td><strong>${((p.precio_centavos||0)/100).toFixed(2)} €</strong></td>
          <td style="font-size:12px;color:#888">${p.creado_en || "—"}</td>
          <td>
            <select class="estado-select" onchange="cambiarEstado(${p.id}, this.value)">
              ${["pendiente","pagado","enviado","completado","cancelado"].map(e =>
                `<option value="${e}" ${e===p.estado?"selected":""}>${e}</option>`
              ).join("")}
            </select>
            <button class="btn-del" style="margin-top:6px" onclick="borrar(${p.id})">Borrar</button>
          </td>
        </tr>
      `).join("");
    }

    async function cambiarEstado(id, estado) {
      await fetch(`/api/admin/pedidos/${id}`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ estado })
      });
      cargarPedidos();
    }

    async function borrar(id) {
      if (!confirm("¿Borrar este pedido?")) return;
      await fetch(`/api/admin/pedidos/${id}`, {
        method: "DELETE",
        headers: { Authorization: `Bearer ${token}` }
      });
      cargarPedidos();
    }

    function esc(s) {
      if (!s) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // Auto-login si hay token
    if (token) {
      showPanel();
      cargarPedidos();
    }

    document.getElementById("password").addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
